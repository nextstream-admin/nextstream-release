<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="NextStream — Press play.">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171b"/>
      <stop offset=".55" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warm"><stop offset="0" stop-color="#ff7a3d" stop-opacity=".28"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool"><stop offset="0" stop-color="#4d8dff" stop-opacity=".24"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(14px,-12px) scale(1.06); } }
      @keyframes pulse { 0%,100% { opacity:.30; } 50% { opacity:.62; } }
      @keyframes blink { 0%,45% { opacity:1; } 50%,95% { opacity:0; } 100% { opacity:1; } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes scan { 0% { transform: translateX(-900px); } 100% { transform: translateX(1500px); } }
      @keyframes glow { 0%,100% { opacity:.45; } 50% { opacity:.85; } }
      .blob { animation: drift 9s ease-in-out infinite; transform-origin: center; }
      .blob2 { animation: drift 11s ease-in-out infinite reverse; transform-origin: center; }
      .pulse { animation: pulse 5s ease-in-out infinite; }
      .scan { animation: scan 7s ease-in-out infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .mark { animation: bob 6s ease-in-out infinite; transform-origin: center; }
      .dot { animation: glow 2.2s ease-in-out infinite; }
      .chip { animation: bob 6s ease-in-out infinite; }
      .c2 { animation-delay: .35s; } .c3 { animation-delay: .7s; } .c4 { animation-delay: 1.05s; } .c5 { animation-delay: 1.4s; } .c6 { animation-delay: 1.75s; }
    </style>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="340" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#ink)"/>
    <g filter="url(#blur)">
      <circle class="blob" cx="1040" cy="60" r="150" fill="url(#warm)"/>
      <circle class="blob2" cx="1120" cy="300" r="180" fill="url(#cool)"/>
      <circle class="blob" cx="940" cy="180" r="110" fill="url(#cool)" opacity=".55"/>
    </g>
    <g opacity=".16" stroke="#ffffff" stroke-width="1">
      <path d="M0 86h1200M0 170h1200M0 254h1200"/>
      <path d="M120 0v340M300 0v340M480 0v340M660 0v340M840 0v340M1020 0v340"/>
    </g>

    <!-- moving light sweep -->
    <g class="scan" opacity=".7"><rect x="-180" y="-60" width="220" height="460" fill="url(#shine)" transform="skewX(-18)"/></g>

    <!-- mark -->
    <g class="mark">
      <rect x="64" y="74" width="92" height="92" rx="24" fill="#0b0b0d" stroke="#ffffff" stroke-opacity=".14"/>
      <path d="M84 145V96h10l23 28V96h11v49h-10l-23-28v28z" fill="#ffffff"/>
      <rect x="118" y="137" width="11" height="11" fill="#ffffff"/>
    </g>

    <!-- wordmark -->
    <text x="188" y="124" fill="#f4f6f8" font-family="SF Pro Display,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.6">NextStream</text>
    <text x="188" y="162" fill="#9aa0aa" font-family="SF Pro Text,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" letter-spacing="-0.2">Press play.<tspan class="cursor" fill="#ff7a3d">▌</tspan></text>

    <!-- live home -->
    <g>
      <circle class="dot" cx="956" cy="66" r="5" fill="#58d68d"/>
      <text x="972" y="72" fill="#9aa0aa" font-family="SF Mono,Menlo,Consolas,monospace" font-size="14">comingupnext.web.app</text>
    </g>

    <!-- platform chips -->
    <g font-family="SF Pro Text,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#d4d8de">
      <g class="chip"><rect x="64" y="236" width="112" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".13"/><text x="84" y="260">macOS</text></g>
      <g class="chip c2"><rect x="186" y="236" width="122" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".13"/><text x="206" y="260">Windows</text></g>
      <g class="chip c3"><rect x="318" y="236" width="132" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".13"/><text x="338" y="260">Samsung</text></g>
      <g class="chip c4"><rect x="460" y="236" width="105" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".13"/><text x="480" y="260">LG webOS</text></g>
      <g class="chip c5"><rect x="575" y="236" width="126" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".13"/><text x="595" y="260">Android TV</text></g>
      <g class="chip c6"><rect x="711" y="236" width="122" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".13"/><text x="731" y="260">Browser</text></g>
    </g>

    <!-- bottom rule -->
    <rect x="64" y="300" width="1072" height="1" fill="#ffffff" fill-opacity=".08"/>
    <text x="64" y="322" fill="#6f757e" font-family="SF Pro Text,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" letter-spacing=".08em">YOUR LIBRARY · YOUR SCREENS · ONE QUIET INTERFACE</text>
    <text x="1136" y="322" text-anchor="end" fill="#6f757e" font-family="SF Mono,Menlo,Consolas,monospace" font-size="13">N.</text>
  </g>
</svg>
