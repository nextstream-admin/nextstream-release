<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="NextStream — Press play. Everything else just works.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d0f"/>
      <stop offset=".55" stop-color="#08080a"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1e"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffffff" stop-opacity=".14"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm"><stop offset="0" stop-color="#ff7a3d" stop-opacity=".16"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool"><stop offset="0" stop-color="#4d8dff" stop-opacity=".12"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <style>
      @keyframes breathe { 0%,100% { opacity:.55; transform: scale(1); } 50% { opacity:.95; transform: scale(1.04); } }
      @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(10px,-8px); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes sweep { 0% { transform: translateX(-700px); } 100% { transform: translateX(1500px); } }
      .halo { animation: breathe 7s ease-in-out infinite; transform-origin: 600px 145px; }
      .warm { animation: drift 10s ease-in-out infinite; transform-origin: 900px 120px; }
      .cool { animation: drift 12s ease-in-out infinite reverse; transform-origin: 300px 300px; }
      .chip { animation: bob 6s ease-in-out infinite; }
      .c2 { animation-delay: .3s; } .c3 { animation-delay: .6s; } .c4 { animation-delay: .9s; } .c5 { animation-delay: 1.2s; } .c6 { animation-delay: 1.5s; }
      .sweep { animation: sweep 9s ease-in-out infinite; }
    </style>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="warm" cx="930" cy="90" r="190" fill="url(#warm)"/>
      <circle class="cool" cx="240" cy="340" r="170" fill="url(#cool)"/>
      <circle class="halo" cx="600" cy="145" r="230" fill="url(#halo)"/>
    </g>

    <g class="sweep" opacity=".5"><rect x="-200" y="-80" width="180" height="580" fill="#ffffff" fill-opacity=".035" transform="skewX(-16)"/></g>

    <!-- wordmark pill, the landing page's "Next." -->
    <g class="halo">
      <rect x="450" y="70" width="300" height="120" rx="60" fill="url(#pill)" stroke="#ffffff" stroke-opacity=".16"/>
      <rect x="459" y="79" width="282" height="102" rx="51" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
      <text x="600" y="154" text-anchor="middle" fill="#f4f6f8" font-family="SF Pro Display,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="-4">Next.</text>
    </g>

    <text x="600" y="254" text-anchor="middle" font-family="SF Pro Text,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" letter-spacing="-.3">
      <tspan fill="#f4f6f8" font-weight="700">Press play.</tspan><tspan fill="#8f949c" font-weight="400"> Everything else just works.</tspan>
    </text>

    <g font-family="SF Pro Text,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#d4d8de">
      <g class="chip"><rect x="255" y="306" width="100" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="305" y="330" text-anchor="middle">Browser</text></g>
      <g class="chip c2"><rect x="369" y="306" width="92" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="415" y="330" text-anchor="middle">macOS</text></g>
      <g class="chip c3"><rect x="475" y="306" width="102" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="526" y="330" text-anchor="middle">Windows</text></g>
      <g class="chip c4"><rect x="591" y="306" width="104" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="643" y="330" text-anchor="middle">Samsung</text></g>
      <g class="chip c5"><rect x="709" y="306" width="90" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="754" y="330" text-anchor="middle">LG</text></g>
      <g class="chip c6"><rect x="813" y="306" width="122" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="874" y="330" text-anchor="middle">Android TV</text></g>
    </g>

    <text x="600" y="382" text-anchor="middle" fill="#6f757e" font-family="SF Mono,Menlo,Consolas,monospace" font-size="12" letter-spacing=".06em">OFFICIAL INSTALLERS · COMINGUPNEXT.WEB.APP</text>
  </g>
</svg>
